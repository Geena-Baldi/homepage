<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Geena Baldi</title>

    <link rel="stylesheet" href="styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <section class="hero">
      <canvas id="flowerCanvas"></canvas>

      <div class="content">
        <div class="hero-card">
          <div class="profile">
            <img src="images/profile.png" alt="Geena Baldi" />
          </div>

          <div class="text">
            <h1>Geena Baldi</h1>

            <p class="subtitle">
              Bringing art and science together through data visualization
            </p>

            <blockquote class="hero-quote">
              Make it simple, but significant.
              <cite>— Don Draper</cite>
            </blockquote>
          </div>
        </div>
      </div>
    </section>

    <script>
      const canvas = document.getElementById("flowerCanvas");
      const ctx = canvas.getContext("2d");

      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      resize();
      window.addEventListener("resize", resize);

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      let targetMouseX = mouseX;
      let targetMouseY = mouseY;

      window.addEventListener("mousemove", (e) => {
        targetMouseX = e.clientX;
        targetMouseY = e.clientY;
      });

      const flowers = [
        {
          baseX: 0.15,
          baseY: 0.2,
          radius: 120,
          color: "#DF84A8",
          rotationSpeed: 0.0001,
          driftRadius: 50,
          driftSpeed: 0.0002,
          depth: 0.2,
        },

        {
          baseX: 0.75,
          baseY: 0.18,
          radius: 95,
          color: "#F9D078",
          rotationSpeed: -0.00012,
          driftRadius: 60,
          driftSpeed: 0.00017,
          depth: 0.3,
        },

        {
          baseX: 0.12,
          baseY: 0.75,
          radius: 135,
          color: "#FA7A91",
          rotationSpeed: 0.00014,
          driftRadius: 50,
          driftSpeed: 0.00015,
          depth: 0.4,
        },

        {
          baseX: 0.88,
          baseY: 0.78,
          radius: 110,
          color: "#EEB0A1",
          rotationSpeed: -0.00011,
          driftRadius: 55,
          driftSpeed: 0.00018,
          depth: 0.5,
        },

        {
          baseX: 0.55,
          baseY: 0.15,
          radius: 65,
          color: "#F6FFA7",
          rotationSpeed: 0.0002,
          driftRadius: 35,
          driftSpeed: 0.00021,
          depth: 0.8,
        },

        {
          baseX: 0.85,
          baseY: 0.45,
          radius: 75,
          color: "#CDEBFF",
          rotationSpeed: -0.00018,
          driftRadius: 40,
          driftSpeed: 0.00023,
          depth: 0.9,
        },

        {
          baseX: 0.2,
          baseY: 0.45,
          radius: 80,
          color: "#FFDCCF",
          rotationSpeed: 0.00022,
          driftRadius: 30,
          driftSpeed: 0.00025,
          depth: 1,
        },
      ];

      function drawPetal(x, y, size, rotation, color) {
        ctx.save();

        ctx.translate(x, y);
        ctx.rotate(rotation);

        const gradient = ctx.createRadialGradient(0, 0, 1, 0, 0, size);

        gradient.addColorStop(0, color);
        gradient.addColorStop(1, "rgba(255,255,255,0)");

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.moveTo(0, 0);

        ctx.bezierCurveTo(
          size * 0.4,
          -size * 0.3,

          size,
          -size,

          0,
          -size * 1.7,
        );

        ctx.bezierCurveTo(
          -size,
          -size,

          -size * 0.4,
          -size * 0.3,

          0,
          0,
        );

        ctx.fill();

        ctx.restore();
      }

      function drawFlower(x, y, radius, level, rotation, color) {
        if (level <= 0) return;

        const petals = 8;

        for (let i = 0; i < petals; i++) {
          const angle = rotation + i * ((Math.PI * 2) / petals);

          const px = x + Math.cos(angle) * radius;

          const py = y + Math.sin(angle) * radius;

          drawPetal(px, py, radius * 0.55, angle, color);

          drawFlower(px, py, radius * 0.35, level - 1, rotation + 0.25, color);
        }
      }

      function drawPollen(time) {
        for (let i = 0; i < 80; i++) {
          const x = ((Math.sin(i * 91.73 + time * 0.00005) + 1) * width) / 2;

          const y = ((Math.cos(i * 77.12 + time * 0.00004) + 1) * height) / 2;

          ctx.beginPath();

          ctx.fillStyle = "rgba(255,255,255,0.25)";

          ctx.arc(x, y, 1.5, 0, Math.PI * 2);

          ctx.fill();
        }
      }

      function animate(time) {
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;

        ctx.clearRect(0, 0, width, height);

        flowers.forEach((flower) => {
          const cx = width * flower.baseX;

          const cy = height * flower.baseY;

          const orbitX =
            Math.cos(time * flower.driftSpeed) * flower.driftRadius;

          const orbitY =
            Math.sin(time * flower.driftSpeed * 0.8) * flower.driftRadius;

          const wanderX = Math.sin(time * 0.0004 + flower.baseX * 20) * 20;

          const wanderY = Math.cos(time * 0.0005 + flower.baseY * 20) * 20;

          const parallaxX = (mouseX - width / 2) * 0.03 * flower.depth;

          const parallaxY = (mouseY - height / 2) * 0.03 * flower.depth;

          const finalX = cx + orbitX + wanderX + parallaxX;

          const finalY = cy + orbitY + wanderY + parallaxY;

          const distance = Math.hypot(mouseX - finalX, mouseY - finalY);

          const bloom =
            1 +
            Math.max(0, 1 - distance / 500) * 0.3 +
            Math.sin(time * 0.001 + flower.baseX * 10) * 0.08;

          drawFlower(
            finalX,
            finalY,
            flower.radius * bloom,
            3,
            time * flower.rotationSpeed,
            flower.color,
          );
        });

        drawPollen(time);

        const glow = ctx.createRadialGradient(
          mouseX,
          mouseY,
          0,
          mouseX,
          mouseY,
          250,
        );

        glow.addColorStop(0, "rgba(255,220,170,0.12)");

        glow.addColorStop(1, "rgba(255,220,170,0)");

        ctx.fillStyle = glow;

        ctx.beginPath();

        ctx.arc(mouseX, mouseY, 250, 0, Math.PI * 2);

        ctx.fill();

        requestAnimationFrame(animate);
      }

      animate(0);
    </script>
  </body>
</html>
